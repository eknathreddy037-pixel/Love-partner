<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Site 💖</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #ffe6eb;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Card */
.container {
  background: white;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  width: 320px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

/* Buttons */
.option {
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: 2px solid #ddd;
  cursor: pointer;
}

.option:hover {
  border-color: #ff4d6d;
}

.selected {
  border-color: #ff4d6d;
  background: #ffe6eb;
}

button {
  background: #ff4d6d;
  color: white;
  border: none;
  padding: 12px;
  width: 100%;
  border-radius: 20px;
  margin-top: 15px;
  cursor: pointer;
}

/* Final Screen */
.hidden {
  display: none;
}

.yes-btn {
  background: #ff4d6d;
  padding: 15px;
  border-radius: 20px;
  color: white;
  font-size: 18px;
  margin-top: 20px;
}

.no-btn {
  position: absolute;
  background: #ddd;
  padding: 10px 15px;
  border-radius: 10px;
  cursor: pointer;
}
</style>

</head>
