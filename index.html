<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Partner 💖</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #ff9a9e, #fecfef);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.container {
  background: white;
  padding: 30px;
  border-radius: 20px;
  width: 320px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  position: relative;
}

h2 {
  color: #ff4d6d;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 20px;
  background: #ff4d6d;
  color: white;
  font-size: 16px;
  cursor: pointer;
  margin-top: 10px;
}

.no-btn {
  background: #ddd;
  position: absolute;
  width: 100px;
}

.hidden {
  display: none;
}

/* animation */
#result {
  font-size: 24px;
  animation: pop 1s infinite alternate;
}

@keyframes pop {
  from { transform: scale(1); }
  to { transform: scale(1.1); }
}
</style>
</head>

<body>

<div class="container">

<!-- STEP 1 -->
<div id="step1">
  <h2>Enter your name 💕</h2>
  <input id="name" placeholder="Your name">
  <button onclick="start()">Continue 💖</button>
</div>

<!-- STEP 2 -->
<div id="step2" class="hidden">
  <h2 id="question"></h2>

  <button onclick="yesClick()">Yes 💖</button>
  <button class="no-btn" id="noBtn" onmouseover="moveNo()">No 😅</button>

  <p id="msg"></p>
</div>

<!-- STEP 3 -->
<div id="step3" class="hidden">
  <h2>Yayyyyy 💖</h2>
  <p id="result">💑💋 Love Accepted 💖</p>
</div>

</div>

<script>
let noCount = 0;

// START
function start(){
  let name = document.getElementById("name").value;

  if(name === ""){
    alert("Enter your name 😅");
    return;
  }

  document.getElementById("step1").classList.add("hidden");
  document.getElementById("step2").classList.remove("hidden");

  document.getElementById("question").innerText =
    name + ", will you forever be mine? 💖";
}

// YES
function yesClick(){
  document.getElementById("step2").classList.add("hidden");
  document.getElementById("step3").classList.remove("hidden");
}

// NO
function moveNo(){
  let btn = document.getElementById("noBtn");

  noCount++;

  if(noCount === 1){
    document.getElementById("msg").innerText = "Oops 😅 wrong choice!";
  }
  else if(noCount === 2){
    document.getElementById("msg").innerText = "Sorry baby 🥺 choose Yes ❤️";
  }
  else {
    document.getElementById("msg").innerText = "Only Yes allowed 😏";
  }

  btn.style.top = Math.random()*200 + "px";
  btn.style.left = Math.random()*200 + "px";
}
</script>

</body>
</html>
