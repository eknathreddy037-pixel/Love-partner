<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Partner 💖</title>

<style>
body {
  font-family: Arial;
  background: #f8d7da;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.container {
  background: white;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  width: 300px;
  box-shadow: 0px 5px 20px rgba(0,0,0,0.1);
}

h2 span {
  color: #ff4d6d;
}

input, select {
  width: 90%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 20px;
  background: #ff4d6d;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
</style>

</head>
<body>

<div class="container">
  <h2>Pick a <span>question</span></h2>
  <p>What do you want to ask?</p>

  <input type="text" id="name" placeholder="Enter name 💕">

  <select id="question">
    <option value="Will you be my girlfriend?">Will you be my girlfriend?</option>
    <option value="Will you forever be mine?">Will you forever be mine?</option>
  </select>

  <button onclick="goNext()">See Preview 💖</button>
</div>

<script>
function goNext() {
  let name = document.getElementById("name").value;
  let q = document.getElementById("question").value;

  if(name === ""){
    alert("Enter name 😅");
    return;
  }

  window.location.href = `question.html?name=${name}&q=${q}`;
}
</script>

</body>
</html>
