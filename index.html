<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Partner 💖</title>

<style>
body {
  font-family: Arial;
  background: #ffd6dc;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.container {
  background: white;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  width: 320px;
}

input, select {
  width: 90%;
  padding: 10px;
  margin: 10px 0;
}

button {
  padding: 10px;
  border-radius: 10px;
  background: #ff4d6d;
  color: white;
  border: none;
  cursor: pointer;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<div class="container">

<!-- STEP 1 -->
<div id="creator">
  <h2>Create Love Link 💖</h2>

  <input type="text" id="sender" placeholder="Your name">

  <select id="question">
    <option>Will you be mine forever?</option>
    <option>Do you love me?</option>
  </select>

  <button onclick="generateLink()">Generate Link</button>

  <p id="output"></p>
</div>

<!-- STEP 2 -->
<div id="receiver" class="hidden">
  <h2>Enter your name 💕</h2>
  <input type="text" id="partner">
  <button onclick="start()">Continue</button>
</div>

<!-- STEP 3 -->
<div id="questionPage" class="hidden">
  <h2 id="qText"></h2>

  <button onclick="yes()">Yes 💖</button>
  <button onclick="no()">No 😅</button>

  <p id="msg"></p>
</div>

<!-- STEP 4 -->
<div id="result" class="hidden">
  <h2>💑 Love Accepted 💖</h2>
</div>

</div>

<script>

// 🔥 THIS IS FIXED LINK GENERATOR
function generateLink(){
  let sender = document.getElementById("sender").value;
  let q = document.getElementById("question").value;

  if(sender === ""){
    alert("Enter name");
    return;
  }

  let base = window.location.origin + window.location.pathname;

  let link = base + "?s=" + encodeURIComponent(sender) + "&q=" + encodeURIComponent(q);

  document.getElementById("output").innerHTML =
    "<br>Copy this link:<br>" +
    "<textarea style='width:100%'>" + link + "</textarea>";
}

// CHECK PARAMS
let url = new URLSearchParams(window.location.search);
let sender = url.get("s");
let question = url.get("q");

if(sender && question){
  document.getElementById("creator").classList.add("hidden");
  document.getElementById("receiver").classList.remove("hidden");
}

// START
function start(){
  let name = document.getElementById("partner").value;

  document.getElementById("receiver").classList.add("hidden");
  document.getElementById("questionPage").classList.remove("hidden");

  document.getElementById("qText").innerText =
    name + ", " + question;
}

// YES
function yes(){
  document.getElementById("questionPage").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
}

// NO
let count = 0;
function no(){
  count++;

  if(count == 1){
    document.getElementById("msg").innerText = "Wrong choice 😅";
  }
  else if(count == 2){
    document.getElementById("msg").innerText = "Sorry choose Yes ❤️";
  }
  else{
    document.getElementById("msg").innerText = "Only Yes allowed 😏";
  }
}

</script>

</body>
</html>
