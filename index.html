<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Partner 💖</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.container {
  background: white;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
  width: 320px;
  box-shadow: 0px 10px 30px rgba(0,0,0,0.15);
  position: relative;
}

h2 {
  color: #ff4d6d;
}

input, select {
  width: 90%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 12px;
  border: 1px solid #ccc;
}

button {
  padding: 12px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  margin: 10px;
  font-size: 15px;
}

.yes-btn {
  background: #ff4d6d;
  color: white;
  width: 100%;
}

.no-btn {
  background: #ddd;
  position: absolute;
}

.hidden {
  display: none;
}

/* hearts animation */
.heart {
  position: fixed;
  color: red;
  animation: floatUp 3s linear infinite;
}

@keyframes floatUp {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-600px); opacity: 0; }
}
</style>
</head>

<body>

<div class="container">

<!-- STEP 1 -->
<div id="creator">
  <h2>Create Love Link 💖</h2>
  <input type="text" id="sender" placeholder="Your name">
  
  <select id="question">
    <option>Will you be my girlfriend?</option>
    <option>Will you forever be mine?</option>
  </select>

  <button onclick="generateLink()">Generate Link 🔗</button>
  <div id="linkBox"></div>
</div>

<!-- STEP 2 -->
<div id="receiver" class="hidden">
  <h2>Enter your name 💕</h2>
  <input type="text" id="partnerName">
  <button onclick="startLove()">Continue 💖</button>
</div>

<!-- STEP 3 -->
<div id="questionPage" class="hidden">
  <h2 id="finalQ"></h2>

  <button class="yes-btn" onclick="yesClick()">Yes 💖</button>
  <button class="no-btn" id="noBtn" onmouseover="moveNo()">No 😅</button>

  <p id="msg"></p>
</div>

<!-- STEP 4 -->
<div id="result" class="hidden">
  <h2>Yayyyyy 💖</h2>
  <p>You are now officially together 💑💋</p>
</div>

</div>

<script>
let noCount = 0;

// GENERATE LINK
function generateLink(){
  let sender = document.getElementById("sender").value;
  let q = document.getElementById("question").value;

  if(sender === ""){
    alert("Enter your name");
    return;
  }

  let baseURL = window.location.href.split("?")[0];

  let link = baseURL + 
    "?sender=" + encodeURIComponent(sender) + 
    "&q=" + encodeURIComponent(q);

  document.getElementById("linkBox").innerHTML =
    `<br>
    <input value="${link}" style="width:100%;padding:8px" readonly>
    <br><br>
    <button onclick="copyLink('${link}')">Copy Link 📋</button>`;
}

// COPY LINK
function copyLink(link){
  navigator.clipboard.writeText(link);
  alert("Link copied! Send to your partner 💖");
}

// CHECK URL PARAMS
const params = new URLSearchParams(window.location.search);
const sender = params.get("sender");
const q = params.get("q");

if(sender && q){
  document.getElementById("creator").classList.add("hidden");
  document.getElementById("receiver").classList.remove("hidden");
}

// START LOVE FLOW
function startLove(){
  let partner = document.getElementById("partnerName").value;

  if(partner === ""){
    alert("Enter your name 😅");
    return;
  }

  document.getElementById("receiver").classList.add("hidden");
  document.getElementById("questionPage").classList.remove("hidden");

  document.getElementById("finalQ").innerText =
    partner + ", " + q + " 💖";
}

// YES CLICK
function yesClick(){
  document.getElementById("questionPage").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  // hearts animation
  setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "💖";
    heart.style.left = Math.random() * window.innerWidth + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 3000);
  }, 300);
}

// NO BUTTON MOVE
function moveNo(){
  let btn = document.getElementById("noBtn");

  noCount++;

  if(noCount === 1){
    document.getElementById("msg").innerText = "Oops 😅 wrong choice!";
  }
  else if(noCount === 2){
    document.getElementById("msg").innerText = "Sorry baby 🥺 choose Yes ❤️";
  }
  else {
    document.getElementById("msg").innerText = "Only Yes is allowed 😏";
  }

  btn.style.top = Math.random()*200 + "px";
  btn.style.left = Math.random()*200 + "px";
}
</script>

</body>
  </html>
