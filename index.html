<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Link 💖</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #ff9a9e, #fecfef);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.container {
  background: #fff;
  padding: 30px;
  border-radius: 20px;
  width: 320px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

h2 {
  color: #ff4d6d;
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ccc;
}

button {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 20px;
  background: #ff4d6d;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

#linkBox {
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">
  <h2>Create Love Link 💖</h2>

  <input id="name" placeholder="Enter your name">

  <select id="question">
    <option>Will you forever be mine?</option>
    <option>Do you love me?</option>
  </select>

  <button onclick="generateLink()">Generate Link 🔗</button>

  <div id="linkBox"></div>
</div>

<script>
function generateLink() {
  var name = document.getElementById("name").value;
  var q = document.getElementById("question").value;

  if(name === ""){
    alert("Enter your name");
    return;
  }

  // IMPORTANT FIX
  var base = window.location.origin + window.location.pathname;

  var finalLink = base + "?name=" + encodeURIComponent(name) + "&q=" + encodeURIComponent(q);

  document.getElementById("linkBox").innerHTML =
    "<p>Copy this link 👇</p>" +
    "<input value='" + finalLink + "' readonly>" +
    "<button onclick='copyText()'>Copy 📋</button>";
}

function copyText(){
  var input = document.querySelector("#linkBox input");
  input.select();
  document.execCommand("copy");
  alert("Copied! Send to your partner 💖");
}
</script>

</body>
</html>
